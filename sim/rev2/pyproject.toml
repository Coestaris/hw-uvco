[project]
name = "uvco-rev2-simulation"
version = "0.1.0"
description = "uvco rev2 ngspice analyses"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.scripts]
uvco-sweep = "uvco_simulation.run_sweep:main"
uvco-full-signal-chain = "uvco_simulation.simulate_full_signal_chain:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "uvco_simulation"
module-root = ""
